<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="8" fill="url(#bgG)"/>

  <!-- Power Adapter (Left) -->
  <g transform="translate(25, 45)">
    <rect x="0" y="15" width="45" height="55" rx="5" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Prongs -->
    <rect x="-8" y="25" width="8" height="6" rx="1" fill="#94A3B8"/>
    <rect x="-8" y="45" width="8" height="6" rx="1" fill="#94A3B8"/>
    <!-- Wire -->
    <path d="M45 45 C75 45, 60 110, 100 110" fill="none" stroke="#1E293B" stroke-width="4"/>
    <!-- DC Jack -->
    <rect x="100" y="107" width="12" height="6" rx="1" fill="#475569"/>
    <rect x="112" y="108" width="6" height="4" fill="#FCD34D"/>
  </g>

  <!-- MikroTik Router (Right) -->
  <g transform="translate(130, 35)">
    <!-- Main Body Box -->
    <rect x="0" y="0" width="165" height="115" rx="6" fill="url(#bodyG)" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Top MikroTik Logo / Text -->
    <rect x="15" y="18" width="28" height="9" rx="2" fill="#0284C7"/>
    <text x="29" y="25" font-family="'Poppins', sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RB750r2</text>
    <text x="145" y="26" font-family="'Poppins', sans-serif" font-size="9" font-weight="900" fill="#0369A1" text-anchor="end" letter-spacing="0.5">MikroTik</text>

    <!-- LED Status Bar -->
    <g transform="translate(15, 38)">
      <circle cx="5" cy="0" r="2.5" fill="#22C55E"/>
      <circle cx="16" cy="0" r="2.5" fill="#22C55E"/>
      <circle cx="27" cy="0" r="2.5" fill="#22C55E"/>
      <circle cx="38" cy="0" r="2.5" fill="#22C55E"/>
      <circle cx="49" cy="0" r="2.5" fill="#22C55E"/>
      <circle cx="68" cy="0" r="2.5" fill="#3B82F6"/>
      <circle cx="82" cy="0" r="2.5" fill="#EAB308"/>
    </g>

    <!-- RJ45 Ethernet Ports (5 Ports) -->
    <g transform="translate(14, 60)">
      <!-- Port 1 (PoE IN / Internet) -->
      <rect x="0" y="0" width="24" height="28" rx="3" fill="#0284C7" stroke="#0369A1" stroke-width="1.2"/>
      <rect x="3" y="10" width="18" height="15" rx="1.5" fill="#0F172A"/>
      <text x="12" y="8" font-family="sans-serif" font-size="5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1 (PoE)</text>

      <!-- Port 2 -->
      <rect x="29" y="0" width="24" height="28" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
      <rect x="32" y="10" width="18" height="15" rx="1.5" fill="#0F172A"/>
      <text x="41" y="8" font-family="sans-serif" font-size="5" font-weight="bold" fill="#475569" text-anchor="middle">2</text>

      <!-- Port 3 -->
      <rect x="57" y="0" width="24" height="28" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
      <rect x="60" y="10" width="18" height="15" rx="1.5" fill="#0F172A"/>
      <text x="69" y="8" font-family="sans-serif" font-size="5" font-weight="bold" fill="#475569" text-anchor="middle">3</text>

      <!-- Port 4 -->
      <rect x="85" y="0" width="24" height="28" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
      <rect x="88" y="10" width="18" height="15" rx="1.5" fill="#0F172A"/>
      <text x="97" y="8" font-family="sans-serif" font-size="5" font-weight="bold" fill="#475569" text-anchor="middle">4</text>

      <!-- Port 5 -->
      <rect x="113" y="0" width="24" height="28" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
      <rect x="116" y="10" width="18" height="15" rx="1.5" fill="#0F172A"/>
      <text x="125" y="8" font-family="sans-serif" font-size="5" font-weight="bold" fill="#475569" text-anchor="middle">5</text>
    </g>

    <!-- Bottom Info -->
    <text x="82" y="104" font-family="'Poppins', sans-serif" font-size="6.5" fill="#64748B" text-anchor="middle">hEX lite • 5x Fast Ethernet</text>
  </g>
</svg>
