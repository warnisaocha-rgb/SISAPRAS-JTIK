<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="bodyCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="8" fill="url(#bgG)"/>

  <!-- LAN Cable Tester Master Unit (Left) -->
  <g transform="translate(60, 20)">
    <!-- Main Shell -->
    <rect x="0" y="0" width="95" height="155" rx="10" fill="url(#bodyCream)" stroke="#94A3B8" stroke-width="1.5"/>
    
    <!-- Top RJ45 Port -->
    <rect x="25" y="-5" width="45" height="12" rx="2" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    
    <!-- Green Panel Center -->
    <rect x="12" y="20" width="71" height="95" rx="6" fill="url(#greenPanel)"/>
    
    <!-- Title on panel -->
    <text x="47" y="34" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CABLE TESTER</text>
    <text x="47" y="42" font-family="'Poppins', sans-serif" font-size="5" fill="#D1FAE5" text-anchor="middle">NS-468 MASTER</text>

    <!-- LED indicators 1 to 8 + G -->
    <g transform="translate(24, 48)">
      <!-- Numbers & LEDs -->
      <circle cx="8" cy="6" r="2.5" fill="#22C55E"/>
      <text x="24" y="8" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">1</text>
      
      <circle cx="8" cy="14" r="2.5" fill="#22C55E"/>
      <text x="24" y="16" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">2</text>
      
      <circle cx="8" cy="22" r="2.5" fill="#22C55E"/>
      <text x="24" y="24" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">3</text>
      
      <circle cx="8" cy="30" r="2.5" fill="#22C55E"/>
      <text x="24" y="32" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">4</text>

      <circle cx="8" cy="38" r="2.5" fill="#22C55E"/>
      <text x="24" y="40" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">5</text>

      <circle cx="8" cy="46" r="2.5" fill="#22C55E"/>
      <text x="24" y="48" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">6</text>

      <circle cx="8" cy="54" r="2.5" fill="#22C55E"/>
      <text x="24" y="56" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">7</text>

      <circle cx="8" cy="62" r="2.5" fill="#22C55E"/>
      <text x="24" y="64" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">8</text>
    </g>

    <!-- Switch ON/OFF -->
    <rect x="36" y="125" width="22" height="14" rx="3" fill="#0F172A"/>
    <rect x="38" y="127" width="10" height="10" rx="2" fill="#E2E8F0"/>
    <text x="47" y="146" font-family="sans-serif" font-size="5" fill="#64748B" text-anchor="middle">ON • S • OFF</text>
  </g>

  <!-- LAN Cable Tester Remote Unit (Right) -->
  <g transform="translate(170, 20)">
    <!-- Shell -->
    <rect x="0" y="0" width="70" height="155" rx="10" fill="url(#bodyCream)" stroke="#94A3B8" stroke-width="1.5"/>
    
    <!-- Top RJ45 Port -->
    <rect x="18" y="-5" width="34" height="12" rx="2" fill="#0F172A" stroke="#64748B" stroke-width="1"/>

    <!-- Green Panel Center -->
    <rect x="10" y="20" width="50" height="95" rx="6" fill="url(#greenPanel)"/>

    <text x="35" y="34" font-family="'Poppins', sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">REMOTE</text>

    <!-- LED indicators 1 to 8 + G -->
    <g transform="translate(18, 48)">
      <circle cx="6" cy="6" r="2.5" fill="#22C55E"/>
      <text x="18" y="8" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">1</text>
      
      <circle cx="6" cy="14" r="2.5" fill="#22C55E"/>
      <text x="18" y="16" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">2</text>
      
      <circle cx="6" cy="22" r="2.5" fill="#22C55E"/>
      <text x="18" y="24" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">3</text>
      
      <circle cx="6" cy="30" r="2.5" fill="#22C55E"/>
      <text x="18" y="32" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">4</text>

      <circle cx="6" cy="38" r="2.5" fill="#22C55E"/>
      <text x="18" y="40" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">5</text>

      <circle cx="6" cy="46" r="2.5" fill="#22C55E"/>
      <text x="18" y="48" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">6</text>

      <circle cx="6" cy="54" r="2.5" fill="#22C55E"/>
      <text x="18" y="56" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">7</text>

      <circle cx="6" cy="62" r="2.5" fill="#22C55E"/>
      <text x="18" y="64" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#FFFFFF">8</text>
    </g>

    <text x="35" y="134" font-family="'Poppins', sans-serif" font-size="5.5" fill="#64748B" text-anchor="middle">RJ45 / RJ11</text>
  </g>
</svg>
