<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="cableG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="boxG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="8" fill="url(#bgG)"/>
  
  <!-- Coiled HDMI Cable -->
  <g transform="translate(15, 10)">
    <!-- Cable coils -->
    <ellipse cx="75" cy="90" rx="60" ry="60" fill="none" stroke="#0F172A" stroke-width="12"/>
    <ellipse cx="75" cy="90" rx="46" ry="46" fill="none" stroke="#1E293B" stroke-width="10"/>
    <ellipse cx="75" cy="90" rx="34" ry="34" fill="none" stroke="#334155" stroke-width="8"/>
    <!-- Braided pattern lines -->
    <ellipse cx="75" cy="90" rx="60" ry="60" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,6"/>
    <ellipse cx="75" cy="90" rx="46" ry="46" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,6"/>
    
    <!-- Red Cable tie velcro -->
    <rect x="70" y="26" width="10" height="20" rx="3" fill="#DC2626"/>
    <rect x="70" y="134" width="10" height="20" rx="3" fill="#DC2626"/>
    
    <!-- Connector 1 -->
    <path d="M125 70 L140 70 L145 65 L155 65 L155 85 L145 85 L140 80 L125 80 Z" fill="#1E293B"/>
    <rect x="155" y="68" width="12" height="14" rx="2" fill="url(#goldG)"/>
    
    <!-- Connector 2 -->
    <path d="M15 110 L30 110 L35 105 L45 105 L45 125 L35 125 L30 120 L15 120 Z" fill="#1E293B"/>
    <rect x="5" y="108" width="10" height="14" rx="2" fill="url(#goldG)"/>
  </g>

  <!-- HDMI Splitter Box -->
  <g transform="translate(175, 45)">
    <!-- Splitter Body -->
    <rect x="0" y="0" width="125" height="95" rx="6" fill="url(#boxG)" stroke="#475569" stroke-width="1.5"/>
    <rect x="6" y="6" width="113" height="83" rx="4" fill="#1E293B" opacity="0.6"/>
    
    <!-- Ports -->
    <rect x="15" y="80" width="22" height="10" rx="1.5" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <rect x="52" y="80" width="22" height="10" rx="1.5" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <rect x="88" y="80" width="22" height="10" rx="1.5" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    
    <!-- Top label / Branding -->
    <text x="62" y="32" font-family="'Poppins', sans-serif" font-size="8" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">HDMI SPLITTER</text>
    <text x="62" y="44" font-family="'Poppins', sans-serif" font-size="6.5" fill="#94A3B8" text-anchor="middle">1 IN 2 OUT • ULTRA HD 4K</text>
    
    <!-- Status LED lights -->
    <circle cx="35" cy="58" r="3" fill="#22C55E"/>
    <circle cx="62" cy="58" r="3" fill="#3B82F6"/>
    <circle cx="89" cy="58" r="3" fill="#3B82F6"/>
    <text x="35" y="68" font-family="sans-serif" font-size="5" fill="#94A3B8" text-anchor="middle">PWR</text>
    <text x="62" y="68" font-family="sans-serif" font-size="5" fill="#94A3B8" text-anchor="middle">OUT 1</text>
    <text x="89" y="68" font-family="sans-serif" font-size="5" fill="#94A3B8" text-anchor="middle">OUT 2</text>
  </g>
</svg>
